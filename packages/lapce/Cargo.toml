[package]
name = "omnigit-lapce"
version = "0.0.1"
edition = "2021"
description = "OmniGit Git Graph and GitLens productivity extension for Lapce"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
lapce-plugin = "0.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
